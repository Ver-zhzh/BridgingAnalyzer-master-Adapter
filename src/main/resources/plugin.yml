name: BridgingAnalyzer
main: sakura.kooi.BridgingAnalyzer.BridgingAnalyzer
version: 2.3.3
authors: [SakuraKooi, Ver_zhzh]
description: Minecraft Bridging Practice for Bedwars - Universal single-jar (1.8.8-26.x+)
website: https://github.com/Ver-zhzh/BridgingAnalyzer-master-Adapter
commands:
  bridge:
    description: Bridging Analyzer Config
    usage: /bridge
  clearblock:
    description: clear placed block
    usage: /clearblock
  imstuck:
    description: destroy near block
    usage: /imstuck
  genvillager:
    description: create villager spawn point
    usage: /genvillager
  bsaveworld:
    description: save the world
    usage: /bsaveworld
permissions:
  bridginganalyzer.noclear:
    default: op
  bridginganalyzer.clear:
    default: op
  bridginganalyzer.admin:
    default: op
